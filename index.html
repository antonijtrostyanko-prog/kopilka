<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Копилка — Вход</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="лого.png" alt="Копилка" class="logo-img">
      <span class="logo-text">Копилка</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link active">Вход</a>
      <a href="main.html" class="nav-link">Копилка</a>
      <a href="profile.html" class="nav-link">Профиль</a>
    </nav>
  </header>

  <main class="main">

    <section class="screen auth-screen">
      <h1 class="screen-title">Вход</h1>
      <p class="screen-subtitle">Войдите, чтобы продолжить копить</p>

      <form class="auth-form">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" placeholder="example@mail.by">

        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" placeholder="••••••••">

        <button type="submit" class="btn btn-primary">Войти</button>
      </form>

      <p class="auth-hint">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Копилка</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
