<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Копилка — Главная</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="лого.png" alt="Копилка" class="logo-img">
      <span class="logo-text">Копилка</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Вход</a>
      <a href="main.html" class="nav-link active">Копилка</a>
      <a href="profile.html" class="nav-link">Профиль</a>
    </nav>
  </header>

  <main class="main">

    <section class="screen main-screen">
      <h1 class="screen-title">Моя копилка</h1>
      <p class="screen-subtitle">Накапливайте уверенно и просто</p>

      <div class="progress-card">
        <div class="progress-circle">
          <span class="progress-text">450 / 1000</span>
          <span class="progress-currency">BYN</span>
        </div>
        <p class="progress-remaining">Осталось 550 BYN</p>
      </div>

      <div class="quick-add">
        <h2 class="section-title">Быстрое пополнение</h2>
        <div class="buttons-row">
          <button class="btn btn-add">+10 BYN</button>
          <button class="btn btn-add">+50 BYN</button>
          <button class="btn btn-add">+100 BYN</button>
        </div>
      </div>

      <div class="history-preview">
        <h2 class="section-title">История пополнений</h2>

        <article class="history-item">
          <div class="history-icon">+</div>
          <div class="history-info">
            <p class="history-name">Регулярный перевод</p>
            <p class="history-date">Сегодня, 14:32</p>
          </div>
          <span class="history-sum">+10 BYN</span>
        </article>

        <article class="history-item">
          <div class="history-icon">★</div>
          <div class="history-info">
            <p class="history-name">Достижение цели: Шаг 2</p>
            <p class="history-date">Вчера, 10:15</p>
          </div>
          <span class="history-sum">+50 BYN</span>
        </article>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Копилка</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
