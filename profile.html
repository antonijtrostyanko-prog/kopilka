<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Копилка — Профиль</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="logo">
      <img src="лого.png" alt="Копилка" class="logo-img">
      <span class="logo-text">Копилка</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link">Вход</a>
      <a href="main.html" class="nav-link">Копилка</a>
      <a href="profile.html" class="nav-link active">Профиль</a>
    </nav>
  </header>

  <main class="main">

    <section class="screen profile-screen">
      <h1 class="screen-title">Профиль</h1>

      <div class="profile-header">
        <div class="profile-avatar">А</div>
        <p class="profile-name">Александр</p>
        <p class="profile-email">alex@mail.by</p>
      </div>

      <div class="profile-goal">
        <h2 class="section-title">Текущая цель</h2>
        <p class="goal-name">Накопить 1000 BYN</p>
        <div class="progress-bar">
          <div class="progress-fill" style="width: 45%;"></div>
        </div>
        <p class="goal-info">Накоплено 450 BYN из 1000 BYN</p>
      </div>

      <div class="settings">
        <h2 class="section-title">Настройки</h2>
        <div class="setting-item">
          <span>Уведомления</span>
          <span class="toggle toggle-on"></span>
        </div>
        <div class="setting-item">
          <span>Валюта</span>
          <span>BYN</span>
        </div>
        <div class="setting-item">
          <span>Сменить пароль</span>
          <span>›</span>
        </div>
      </div>

      <button class="btn btn-logout">Выйти</button>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Копилка</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
